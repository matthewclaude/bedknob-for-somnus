<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Bedknob">
  <title>Bedknob — night</title>
  <!-- Night palette. Every value has blue <= 0x18 per design-spec.md section 2. -->
  <!-- Drawn from a real brass bedpost finial: ball, waisted stem with a bead,
       flared bell collar, stepped base, dark post running off the bottom edge.
       The flare and the waist are what separate a bedpost from a flagpole. -->
  <rect x="76" y="170" width="48" height="30" fill="#785018"/>
  <rect x="64" y="160" width="72" height="11" rx="3" fill="#906818"/>
  <path d="M56 160 Q56 130 100 126 Q144 130 144 160 Z" fill="#906818"/>
  <rect x="93" y="98" width="14" height="30" rx="2" fill="#906818"/>
  <rect x="84" y="110" width="32" height="8" rx="4" fill="#906818"/>
  <circle cx="100" cy="66" r="46" fill="#906818"/>
  <!-- pointer: knocked out to bg. The one thing a real finial does not have,
       and the only signal that this is a control. Always points up. -->
  <line x1="100" y1="66" x2="100" y2="30" stroke="#100C08" stroke-width="12" stroke-linecap="round"/>
</svg>
