# A tag "somnus-vX.Y.Z" builds firmware/dial-idf and publishes build/somnus-dial.bin
# to a GitHub Release; dial_ota.c polls that release's tag_name/asset to decide
# whether a device should update, so the tag must match CMakeLists.txt's PROJECT_VER.
# The same build also produces a merged single-file image (bootloader + partition
# table + otadata + app, flashable from offset 0x0) via `esptool merge-bin`, which
# is attached to the release as somnus-dial-merged.bin and deployed to GitHub Pages
# at firmware/latest/somnus-dial-merged.bin so the browser-based ESP Web Tools
# flasher page (web-flasher/) always points at the latest build.
#
# The tag is pushed to (and this workflow runs in) THIS repo, which is
# public. The Release object and the gh-pages site are published here and
# nowhere else (docs/SPEC-repo-consolidation.md, Phase 6a).
# matthewclaude/somnus-dial-releases is the frozen pre-1.0.1 location that
# dials at or below 1.0.0 polled (docs/SPEC-ota-readiness.md §5 for why it
# existed). It is kept read-only and is never deleted or renamed, because
# its 1.0.1 Release is the permanent over-the-air migration path for any
# such dial. Nothing in this workflow writes to it.
name: release

on:
  push:
    tags:
      - 'somnus-v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches PROJECT_VER
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#somnus-v}"
          PROJECT_VER="$(grep -oP 'set\(PROJECT_VER\s+"\K[^"]+' firmware/dial-idf/CMakeLists.txt)"
          if [ -z "$PROJECT_VER" ]; then
            echo "::error::Could not find PROJECT_VER in firmware/dial-idf/CMakeLists.txt"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PROJECT_VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match PROJECT_VER $PROJECT_VER in firmware/dial-idf/CMakeLists.txt"
            exit 1
          fi
          echo "Tag version $TAG_VERSION matches PROJECT_VER $PROJECT_VER"

      # The release body comes from CHANGELOG.md's section for this version.
      # Checked HERE, before the ~3min build, so a forgotten entry fails in
      # seconds rather than after a full compile — and checked at all because
      # the first 20 releases shipped with empty bodies precisely because
      # nothing ever asked for one.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VER="${GITHUB_REF_NAME#somnus-v}"
          # Section runs from "## <version>" (exact — 1.2.0 must not match
          # 1.2.0-beta.1) to the next "## " heading.
          BODY="$(awk -v ver="$VER" '
            $0 == "## " ver || index($0, "## " ver " ") == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md)"
          # Trim leading/trailing blank lines.
          BODY="$(printf '%s\n' "$BODY" | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba')"
          if [ -z "$BODY" ]; then
            echo "::error::No '## $VER' section in CHANGELOG.md. Add one describing what changed, then re-tag."
            exit 1
          fi
          # No "full changelog" compare link yet. The notes are published
          # into THIS repo only, so a compare link built from
          # ${GITHUB_REPOSITORY} would now resolve; adding one is a separate
          # change, not part of the Phase 6a cut-over.
          {
            echo 'body<<RELEASE_NOTES_EOF'
            printf '%s\n' "$BODY"
            echo
            echo "Dials already running the firmware pick this up on their own — see Menu → Update."
            echo "For a first install, use the [browser flasher](https://matthewclaude.github.io/bedknob-for-somnus/); \`somnus-dial-merged.bin\` below is the same image for flashing manually from offset 0x0."
            echo
            echo "Required Notice: Copyright (c) 2026 Chris Meyer (https://github.com/chris023/orion-waveshare-rotary-dial)"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Release notes for $VER:"
          printf '%s\n' "$BODY"

      # Beta channel: a tag like somnus-v1.1.0-beta.1 publishes as a GitHub
      # PRERELEASE. That single flag is what keeps the two channels apart —
      # /releases/latest (what a stable dial polls, and what the flasher's
      # default manifest serves) excludes prereleases by definition, so only
      # devices with "Beta builds" on, which read the full releases list,
      # ever see these.
      - name: Classify release channel
        id: channel
        run: |
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "pages_dir=beta"  >> "$GITHUB_OUTPUT"
            echo "Channel: BETA (prerelease)"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "pages_dir=latest" >> "$GITHUB_OUTPUT"
            echo "Channel: STABLE"
          fi

      - name: Build firmware and merge flashable image (firmware/dial-idf)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          target: esp32s3
          path: 'firmware/dial-idf'
          command: idf.py build && cd build && python -m esptool --chip esp32s3 merge-bin -o somnus-dial-merged.bin @flash_args

      - name: Upload merged image for the Pages job
        uses: actions/upload-artifact@v4
        with:
          name: somnus-dial-merged
          path: firmware/dial-idf/build/somnus-dial-merged.bin
          retention-days: 1

      # The only Release published: into THIS repo, which is where
      # dial_ota.c has polled since 1.0.1-beta.1. No repository: or
      # token: keys: the action defaults to the workflow's own repo and to
      # GITHUB_TOKEN, which the workflow-level `contents: write` covers.
      - name: Publish GitHub Release (this repo)
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.channel.outputs.prerelease }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            firmware/dial-idf/build/somnus-dial.bin
            firmware/dial-idf/build/somnus-dial-merged.bin

  deploy-pages:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download merged image
        uses: actions/download-artifact@v4
        with:
          name: somnus-dial-merged
          path: /tmp/somnus-dial-merged

      # Each channel owns its own directory: a beta deploy must never
      # overwrite the image that the flasher's default (stable) manifest
      # serves. keep_files below is what preserves the other channel's
      # directory across deploys.
      - name: Channel directory
        id: channel
        run: |
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then
            echo "dir=beta" >> "$GITHUB_OUTPUT"
          else
            echo "dir=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble Pages site
        run: |
          mkdir -p _site/firmware/${{ steps.channel.outputs.dir }}
          cp web-flasher/index.html web-flasher/manifest.json web-flasher/manifest-beta.json _site/
          cp /tmp/somnus-dial-merged/somnus-dial-merged.bin \
             _site/firmware/${{ steps.channel.outputs.dir }}/somnus-dial-merged.bin

      # _site into THIS repo's gh-pages branch, the only place the flasher
      # is deployed (docs/SPEC-repo-consolidation.md §4(b), Phase 6a).
      # GITHUB_TOKEN is enough for a push within the workflow's own repo.
      # The gh-pages branch exists: the 1.0.1-beta.1 run created it, and
      # Pages is enabled on it (gh-pages branch, root) and serving.
      # keep_files preserves the OTHER channel's directory across deploys:
      # a beta deploy must not delete firmware/latest/ and vice versa.
      # (NOT force_orphan, which wipes the branch on every deploy.)
      - name: Deploy to gh-pages (this repo)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: true
