# A tag "somnus-vX.Y.Z" builds firmware/dial-idf and publishes build/somnus-dial.bin
# to a GitHub Release; dial_ota.c polls that release's tag_name/asset to decide
# whether a device should update, so the tag must match CMakeLists.txt's PROJECT_VER.
# The same build also produces a merged single-file image (bootloader + partition
# table + otadata + app, flashable from offset 0x0) via `esptool merge-bin`, which
# is attached to the release as somnus-dial-merged.bin and deployed to GitHub Pages
# at firmware/latest/somnus-dial-merged.bin so the browser-based ESP Web Tools
# flasher page (web-flasher/) always points at the latest build.
#
# The tag is pushed to (and this workflow runs in) THIS repo, which is
# public -- and since 1.0.1-beta.1 the Release object and the gh-pages site
# are published here AND into the matthewclaude/somnus-dial-releases repo
# (see docs/SPEC-repo-consolidation.md; docs/SPEC-ota-readiness.md §5 for
# why that repo existed). The old repo keeps getting releases because every
# shipped 1.0.0 dial polls it, and dual-publishing is how those dials find
# the build that repoints them. Both cross-repo writes (the Release API and
# the gh-pages branch push) use the SOMNUS_RELEASES_TOKEN secret -- a
# fine-grained PAT scoped to
# `contents: write` on that repo only, which covers both: a fine-grained
# PAT's "Contents" permission is what gates the Releases API AND git pushes
# to branches, so one token suffices for both jobs below.
name: release

on:
  push:
    tags:
      - 'somnus-v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches PROJECT_VER
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#somnus-v}"
          PROJECT_VER="$(grep -oP 'set\(PROJECT_VER\s+"\K[^"]+' firmware/dial-idf/CMakeLists.txt)"
          if [ -z "$PROJECT_VER" ]; then
            echo "::error::Could not find PROJECT_VER in firmware/dial-idf/CMakeLists.txt"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PROJECT_VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match PROJECT_VER $PROJECT_VER in firmware/dial-idf/CMakeLists.txt"
            exit 1
          fi
          echo "Tag version $TAG_VERSION matches PROJECT_VER $PROJECT_VER"

      # The release body comes from CHANGELOG.md's section for this version.
      # Checked HERE, before the ~3min build, so a forgotten entry fails in
      # seconds rather than after a full compile — and checked at all because
      # the first 20 releases shipped with empty bodies precisely because
      # nothing ever asked for one.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VER="${GITHUB_REF_NAME#somnus-v}"
          # Section runs from "## <version>" (exact — 1.2.0 must not match
          # 1.2.0-beta.1) to the next "## " heading.
          BODY="$(awk -v ver="$VER" '
            $0 == "## " ver || index($0, "## " ver " ") == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md)"
          # Trim leading/trailing blank lines.
          BODY="$(printf '%s\n' "$BODY" | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba')"
          if [ -z "$BODY" ]; then
            echo "::error::No '## $VER' section in CHANGELOG.md. Add one describing what changed, then re-tag."
            exit 1
          fi
          # No "full changelog" compare link: the same notes get published
          # into THIS repo and into matthewclaude/somnus-dial-releases (see
          # top-of-file comment), and the latter has no commit/tag history
          # of its own -- a compare link built from ${GITHUB_REPOSITORY}
          # would resolve here but is dead text on the old repo's copy of
          # the notes, and one built against the old repo wouldn't resolve
          # at all (no tags to diff there). Revisit after the migration.
          {
            echo 'body<<RELEASE_NOTES_EOF'
            printf '%s\n' "$BODY"
            echo
            echo "Dials already running the firmware pick this up on their own — see Menu → Update."
            echo "For a first install, use the [browser flasher](https://matthewclaude.github.io/somnus-dial-releases/); \`somnus-dial-merged.bin\` below is the same image for flashing manually from offset 0x0."
            echo
            echo "Required Notice: Copyright (c) 2026 Chris Meyer (https://github.com/chris023/orion-waveshare-rotary-dial)"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Release notes for $VER:"
          printf '%s\n' "$BODY"

      # Beta channel: a tag like somnus-v1.1.0-beta.1 publishes as a GitHub
      # PRERELEASE. That single flag is what keeps the two channels apart —
      # /releases/latest (what a stable dial polls, and what the flasher's
      # default manifest serves) excludes prereleases by definition, so only
      # devices with "Beta builds" on, which read the full releases list,
      # ever see these.
      - name: Classify release channel
        id: channel
        run: |
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "pages_dir=beta"  >> "$GITHUB_OUTPUT"
            echo "Channel: BETA (prerelease)"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "pages_dir=latest" >> "$GITHUB_OUTPUT"
            echo "Channel: STABLE"
          fi

      - name: Build firmware and merge flashable image (firmware/dial-idf)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          target: esp32s3
          path: 'firmware/dial-idf'
          command: idf.py build && cd build && python -m esptool --chip esp32s3 merge-bin -o somnus-dial-merged.bin @flash_args

      - name: Upload merged image for the Pages job
        uses: actions/upload-artifact@v4
        with:
          name: somnus-dial-merged
          path: firmware/dial-idf/build/somnus-dial-merged.bin
          retention-days: 1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: matthewclaude/somnus-dial-releases
          token: ${{ secrets.SOMNUS_RELEASES_TOKEN }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            firmware/dial-idf/build/somnus-dial.bin
            firmware/dial-idf/build/somnus-dial-merged.bin

      # Same Release, same notes, same two files, into THIS repo -- the
      # location dial_ota.c polls from 1.0.1-beta.1 on. No repository: or
      # token: keys: the action defaults to the workflow's own repo and to
      # GITHUB_TOKEN, which the workflow-level `contents: write` covers.
      # Runs after the old-repo step on purpose: if this one fails, the repo
      # that shipped 1.0.0 dials actually poll already has the Release.
      - name: Publish GitHub Release (this repo)
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.channel.outputs.prerelease }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            firmware/dial-idf/build/somnus-dial.bin
            firmware/dial-idf/build/somnus-dial-merged.bin

  deploy-pages:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download merged image
        uses: actions/download-artifact@v4
        with:
          name: somnus-dial-merged
          path: /tmp/somnus-dial-merged

      # Each channel owns its own directory: a beta deploy must never
      # overwrite the image that the flasher's default (stable) manifest
      # serves. keep_files below is what preserves the other channel's
      # directory across deploys.
      - name: Channel directory
        id: channel
        run: |
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then
            echo "dir=beta" >> "$GITHUB_OUTPUT"
          else
            echo "dir=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble Pages site
        run: |
          mkdir -p _site/firmware/${{ steps.channel.outputs.dir }}
          cp web-flasher/index.html web-flasher/manifest.json web-flasher/manifest-beta.json _site/
          cp /tmp/somnus-dial-merged/somnus-dial-merged.bin \
             _site/firmware/${{ steps.channel.outputs.dir }}/somnus-dial-merged.bin

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Same cross-repo PAT as the release-publish job above (see
          # top-of-file comment) -- external_repository + personal_token is
          # peaceiris/actions-gh-pages's documented way to push a gh-pages
          # branch into a different repo than the one the workflow runs in;
          # the default GITHUB_TOKEN can only ever push within this repo.
          personal_token: ${{ secrets.SOMNUS_RELEASES_TOKEN }}
          external_repository: matthewclaude/somnus-dial-releases
          publish_dir: ./_site
          publish_branch: gh-pages
          # NOT force_orphan: that wipes the branch on every deploy, which
          # would delete the OTHER channel's firmware image. keep_files
          # preserves firmware/latest/ when a beta publishes and vice versa.
          keep_files: true

      # The same _site into THIS repo's gh-pages branch, so the flasher
      # exists at this repo's Pages URL too (docs/SPEC-repo-consolidation.md
      # §4(b)). GITHUB_TOKEN is enough for a push within the workflow's own
      # repo. This repo has no gh-pages branch yet: the first run creates it
      # from _site alone. keep_files matters from the second run on, for the
      # same stable-vs-beta directory reason as above. Serving it is a
      # repo setting (Pages: gh-pages branch, root) that the workflow cannot
      # enable.
      - name: Deploy to gh-pages (this repo)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: true
