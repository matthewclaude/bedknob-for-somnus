<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepy Pad Temperature Log Viewer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #8b7355 0%, #6b5d4f 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 1rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .stat-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 500;
            color: #333;
        }
        
        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 16px;
            font-size: 12px;
            color: #666;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }
        
        .file-input {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        input[type="file"] {
            padding: 10px;
            border: 2px solid #8b7355;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .info {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛏️ Sleepy Pad Temperature Log</h1>
        
        <div class="file-input">
            <label for="csvFile" style="display: block; margin-bottom: 10px; font-weight: 500;">
                Select your sleep_temps.csv file:
            </label>
            <input type="file" id="csvFile" accept=".csv" />
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
        <div id="info" class="info" style="display: none;"></div>
        
        <div id="statsContainer" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Duration</div>
                    <div class="stat-value" id="duration">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Data points</div>
                    <div class="stat-value" id="dataPoints">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Avg temp (left)</div>
                    <div class="stat-value" id="avgTemp">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Temp range</div>
                    <div class="stat-value" id="tempRange">-</div>
                </div>
            </div>
        </div>
        
        <div id="chartContainer" class="chart-container" style="display: none;">
            <div class="legend">
                <span class="legend-item">
                    <span class="legend-color" style="background: #378ADD;"></span>
                    Left side current
                </span>
                <span class="legend-item">
                    <span class="legend-color" style="background: #85B7EB;"></span>
                    Right side current
                </span>
                <span class="legend-item">
                    <span class="legend-color" style="background: #888780; border: 1px dashed #888780;"></span>
                    Target temp
                </span>
            </div>
            <div style="position: relative; height: 400px;">
                <canvas id="tempChart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <script>
        let chartInstance = null;
        
        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    parseAndDisplayData(event.target.result);
                } catch (error) {
                    showError('Error parsing CSV: ' + error.message);
                }
            };
            reader.readAsText(file);
        });
        
        function parseAndDisplayData(csvText) {
            const lines = csvText.trim().split('\n');
            const headers = lines[0].split(',');
            
            const data = {
                timestamps: [],
                side0_current: [],
                side0_target: [],
                side1_current: [],
                side1_target: []
            };
            
            const seenTimes = new Set();
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                const timestamp = values[0];
                
                if (seenTimes.has(timestamp)) continue;
                seenTimes.add(timestamp);
                
                const side0_c = parseFloat(values[1]);
                const side0_target_c = parseFloat(values[2]);
                const side1_c = parseFloat(values[5]);
                const side1_target_c = parseFloat(values[6]);
                
                // Convert to Fahrenheit
                data.timestamps.push(timestamp);
                data.side0_current.push(side0_c * 9/5 + 32);
                data.side0_target.push(side0_target_c * 9/5 + 32);
                data.side1_current.push(side1_c * 9/5 + 32);
                data.side1_target.push(side1_target_c * 9/5 + 32);
            }
            
            if (data.timestamps.length === 0) {
                showError('No valid data found in CSV file');
                return;
            }
            
            // Format time labels
            const timeLabels = data.timestamps.map(ts => {
                const date = new Date(ts);
                return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            });
            
            // Calculate statistics
            const duration = calculateDuration(data.timestamps[0], data.timestamps[data.timestamps.length - 1]);
            const avgTemp = (data.side0_current.reduce((a, b) => a + b, 0) / data.side0_current.length).toFixed(1);
            const minTemp = Math.min(...data.side0_current).toFixed(1);
            const maxTemp = Math.max(...data.side0_current).toFixed(1);
            
            // Update stats
            document.getElementById('duration').textContent = duration;
            document.getElementById('dataPoints').textContent = data.timestamps.length;
            document.getElementById('avgTemp').textContent = avgTemp + '°F';
            document.getElementById('tempRange').textContent = minTemp + ' - ' + maxTemp + '°F';
            
            // Show containers
            document.getElementById('error').style.display = 'none';
            document.getElementById('statsContainer').style.display = 'block';
            document.getElementById('chartContainer').style.display = 'block';
            
            // Display chart
            displayChart(timeLabels, data);
            
            showInfo(`Loaded ${data.timestamps.length} temperature readings from ${data.timestamps[0]} to ${data.timestamps[data.timestamps.length - 1]}`);
        }
        
        function calculateDuration(start, end) {
            const startDate = new Date(start);
            const endDate = new Date(end);
            const diffMs = endDate - startDate;
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
            
            if (diffHours > 0) {
                return `${diffHours}h ${diffMins}m`;
            } else {
                return `${diffMins}m`;
            }
        }
        
        function displayChart(labels, data) {
            const ctx = document.getElementById('tempChart').getContext('2d');
            
            // Destroy existing chart if it exists
            if (chartInstance) {
                chartInstance.destroy();
            }
            
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Left side current',
                            data: data.side0_current,
                            borderColor: '#378ADD',
                            backgroundColor: 'rgba(55, 138, 221, 0.1)',
                            borderWidth: 2,
                            tension: 0.3,
                            fill: false,
                            pointRadius: 0,
                            pointHoverRadius: 4
                        },
                        {
                            label: 'Right side current',
                            data: data.side1_current,
                            borderColor: '#85B7EB',
                            backgroundColor: 'rgba(133, 183, 235, 0.1)',
                            borderWidth: 2,
                            tension: 0.3,
                            fill: false,
                            pointRadius: 0,
                            pointHoverRadius: 4
                        },
                        {
                            label: 'Target temp',
                            data: data.side0_target,
                            borderColor: '#888780',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            tension: 0,
                            fill: false,
                            pointRadius: 0,
                            pointHoverRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    resizeDelay: 0,
                    animation: false,
                    animations: {
                        colors: false,
                        x: false,
                        y: false
                    },
                    transitions: {
                        active: {
                            animation: {
                                duration: 0
                            }
                        }
                    },
                    onResize: function(chart, size) {
                        chart.update('none');
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y.toFixed(1) + '°F';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                maxRotation: 45,
                                minRotation: 45,
                                autoSkip: true,
                                maxTicksLimit: 20
                            }
                        },
                        y: {
                            beginAtZero: false,
                            min: Math.floor(Math.min(...data.side0_current, ...data.side1_current)) - 5,
                            max: Math.ceil(Math.max(...data.side0_current, ...data.side1_current, ...data.side0_target)) + 5,
                            ticks: {
                                callback: function(value) {
                                    return value + '°F';
                                }
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            }
                        }
                    }
                }
            });
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('statsContainer').style.display = 'none';
            document.getElementById('chartContainer').style.display = 'none';
        }
        
        function showInfo(message) {
            const infoDiv = document.getElementById('info');
            infoDiv.textContent = message;
            infoDiv.style.display = 'block';
        }
    </script>
</body>
</html>
